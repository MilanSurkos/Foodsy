{% extends 'base.html' %}
{% load static %}

{% block content %}
  <h1>{{ product.name }}</h1>
  {% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.name }}">
  {% endif %}
  <p>{{ product.description }}</p>
  <p>Cena: {{ product.price }} Kč</p>
  <a href="{% url 'products:produkty_podla_kategorie' product.kategorie.id %}">Späť na kategóriu</a>
{% endblock %}
