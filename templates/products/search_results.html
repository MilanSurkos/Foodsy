{% extends "base.html" %}
{% block content %}
  <h2>Výsledky vyhledávání: "{{ query }}"</h2>
  {% if products %}
    <div class="product-list">
      {% for product in products %}
        {% include "products/product_card.html" with product=product %}
      {% endfor %}
    </div>
  {% else %}
    <p>Žádné produkty nenalezeny.</p>
  {% endif %}
{% endblock %}
