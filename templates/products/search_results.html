{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Výsledky vyhľadávania</h2>
<div class="product-grid">
  {% for product in products %}
    {% include "products/product_card.html" with product=product %}
  {% empty %}
    <p>Nenašli sa žiadne produkty.</p>
  {% endfor %}
</div>
{% endblock %}
