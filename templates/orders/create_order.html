{% extends 'base.html' %}

{% block content %}
<h2>Vytvoriť objednávku</h2>

<form method="post">
  {% csrf_token %}

  <label for="delivery_address">Doručovacia adresa:</label><br>
  <input type="text" id="delivery_address" name="delivery_address" style="width: 300px;" required><br><br>

  <label for="city">Mesto:</label><br>
  <input type="text" id="city" name="city" style="width: 300px;" required><br><br>

  <label for="phone">Telefónne číslo:</label><br>
  <input type="tel" id="phone" name="phone" pattern="[0-9+\-\s]+" placeholder="+421 123 456 789" style="width: 300px;" required><br><br>

  <label for="email">E-mail:</label><br>
  <input type="email" id="email" name="email" style="width: 300px;" required><br><br>

  <label for="delivery_date">Dátum doručenia:</label><br>
  <input type="date" id="delivery_date" name="delivery_date" style="width: 150px;" required><br><br>

  <label for="delivery_time">Čas doručenia:</label><br>
  <select id="delivery_time" name="delivery_time" style="width: 200px;" required>
    <option value="morning">Ráno (8:00 - 12:00)</option>
    <option value="afternoon">Popoludnie (12:00 - 18:00)</option>
  </select><br><br>

  <button type="submit">Potvrdiť objednávku</button>
</form>

<br>
<a href="{% url 'basket:basket' %}">← Späť do košíka</a>

{% endblock %}
